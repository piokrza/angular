<form class="form grid gap-4">
  <mat-form-field>
    <mat-label>First Name</mat-label>
    <input matInput type="text" id="name" />
  </mat-form-field>

  <mat-form-field>
    <mat-label>Last Name</mat-label>
    <input matInput type="text" id="last-name" />
  </mat-form-field>

  <mat-form-field>
    <mat-label for="nick-name">Nick Name</mat-label>
    <input matInput type="text" id="nick-name" />
  </mat-form-field>

  <mat-form-field>
    <mat-label for="email">Email</mat-label>
    <input matInput type="email" id="email" />
  </mat-form-field>

  <mat-form-field>
    <mat-label>Year of birth</mat-label>
    <mat-select>
      @for (year of years; track $index) {
        <mat-option [value]="year">{{ year }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <mat-form-field>
    <mat-label for="passport">Passport Number</mat-label>
    <input matInput type="text" id="passport" />
  </mat-form-field>

  <legend>Address</legend>
  <mat-form-field>
    <mat-label for="full-address">Full Adress</mat-label>
    <input matInput type="text" id="full-address" />
  </mat-form-field>

  <mat-form-field>
    <mat-label for="city">City</mat-label>
    <input matInput type="text" id="city" />
  </mat-form-field>

  <mat-form-field>
    <mat-label for="post-code">Post Code</mat-label>
    <input matInput type="number" id="post-code" />
  </mat-form-field>

  <button matButton="outlined">Save</button>
</form>
